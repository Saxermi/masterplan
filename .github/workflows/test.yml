name: Test MasterPlan
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          python -m py_compile server.py vvz_dump.py vvz_schedule.py
          node --check web/app.js
          node --check web/study-rules.js
          node --check web/grade-model.js
          node --check web/grade-formula.js
          node --check web/exchange.js
      - name: Python unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Degree and grade allocation tests
        run: node --test tests/*.test.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser regressions with synthetic data
        run: |
          python tests/browser_smoke.py
          python tests/browser_allocations.py
          python tests/browser_semester_flow.py
          python tests/browser_bulk.py
          python tests/browser_seminar.py
          python tests/browser_history_details.py
          python tests/browser_grades.py
          python tests/browser_analytics.py
          python tests/browser_conflicts_calendar.py
          python tests/browser_simulation_defaults.py
